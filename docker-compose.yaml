services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT_BACKEND}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./frontend/public
          target: /app/public
          initial_sync: true
        - action: rebuild
          path: ./frontend/package.json

  shapes-engine:
    build:
      context: ./shapes-engine
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - PORT=${PORT_SHAPES_ENGINE}
    develop:
      watch:
        - action: sync
          path: ./shapes-engine/src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./shapes-engine/requirements.txt

volumes:
  postgres_data:
