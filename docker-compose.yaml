services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      MIGRATOR_USER: ${MIGRATOR_USER}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      RUNTIME_USER: ${RUNTIME_USER}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-users.sh:/docker-entrypoint-initdb.d/init-users.sh:ro

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: npm run db:migrate
    environment:
      MIGRATOR_DATABASE_URL: postgres://${MIGRATOR_USER}:${MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB_NAME}
    volumes:
      - ./backend/drizzle:/app/drizzle
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: npm run db:seed
    environment:
      RUNTIME_DATABASE_URL: postgres://${RUNTIME_USER}:${RUNTIME_PASSWORD}@db:5432/${POSTGRES_DB_NAME}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
    depends_on:
      migration:
        condition: service_completed_successfully
      terraform:
         condition: service_completed_successfully

  s3:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request; urllib.request.urlopen("http://localhost:4566/_localstack/health")''',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  terraform:
    image: hashicorp/terraform:latest
    container_name: terraform_init
    volumes:
      - ./terraform:/infra
    working_dir: /infra
    environment:
      TF_VAR_s3_endpoint: ${S3_ENDPOINT}
      TF_VAR_s3_access_key: ${S3_ACCESS_KEY}
      TF_VAR_s3_secret_key: ${S3_SECRET_KEY}
      TF_VAR_bucket_name: ${S3_BUCKET_NAME}
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "
      terraform init &&
      terraform apply -auto-approve
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT_BACKEND}
      RUNTIME_DATABASE_URL: postgres://${RUNTIME_USER}:${RUNTIME_PASSWORD}@db:5432/${POSTGRES_DB_NAME}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      # terraform:
      #   condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./frontend/public
          target: /app/public
          initial_sync: true
        - action: rebuild
          path: ./frontend/package.json

  shapes-engine:
    build:
      context: ./shapes-engine
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - PORT=${PORT_SHAPES_ENGINE}
    develop:
      watch:
        - action: sync
          path: ./shapes-engine/src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./shapes-engine/requirements.txt

volumes:
  postgres_data:
  minio_data:
